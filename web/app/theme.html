<!doctype html>
<html lang="en" data-theme="hangarworks">
<head>
<meta charset="utf-8">
<title>Theme switch — page and 3D view</title>
<style>
  /* Stands in for the Hangarworks stylesheet: the same token names, defined
     per data-theme, so a switch here is the switch the real site performs. */
  :root, [data-theme="hangarworks"] {
    --sc-dark: #0a1219; --sc-card: #16292f;
    --sc-surface: color-mix(in srgb, var(--sc-card), var(--sc-text) 7%);
    --sc-surface-2: #1e3a44; --sc-field: #1e3a44;
    --sc-border: #2c4e5d;
    --sc-border-bright: color-mix(in srgb, var(--sc-border), var(--sc-text) 42%);
    --sc-text: #eaf2f6; --sc-subtle: #9fb6c2;
    --sc-accent: #ff8a34; --sc-accent-ink: #0a1219; --sc-badge: #5ad1e6;
  }
  /* Light-leaning, as dolomite is. */
  [data-theme="dolomite"] {
    --sc-dark: #f4f6f8; --sc-card: #ffffff;
    --sc-surface: color-mix(in srgb, var(--sc-card), var(--sc-text) 7%);
    --sc-surface-2: #ecf0f3; --sc-field: #ecf0f3;
    --sc-border: #c6d0d8;
    --sc-border-bright: color-mix(in srgb, var(--sc-border), var(--sc-text) 42%);
    --sc-text: #101c26; --sc-subtle: #4e606e;
    --sc-accent: #a64a08; --sc-accent-ink: #ffffff; --sc-badge: #0e6476;
  }
  [data-theme="keystone"] {
    --sc-dark: #17130f; --sc-card: #241d17;
    --sc-surface: color-mix(in srgb, var(--sc-card), var(--sc-text) 7%);
    --sc-surface-2: #33291f; --sc-field: #33291f;
    --sc-border: #5a4938;
    --sc-border-bright: color-mix(in srgb, var(--sc-border), var(--sc-text) 42%);
    --sc-text: #f5ece1; --sc-subtle: #c2ae97;
    --sc-accent: #e0a145; --sc-accent-ink: #17130f; --sc-badge: #7fc8a9;
  }
  [data-theme="navy"] {
    --sc-dark: #070d1c; --sc-card: #101a33;
    --sc-surface: color-mix(in srgb, var(--sc-card), var(--sc-text) 7%);
    --sc-surface-2: #172547; --sc-field: #172547;
    --sc-border: #2a3d66;
    --sc-border-bright: color-mix(in srgb, var(--sc-border), var(--sc-text) 42%);
    --sc-text: #e6ecfa; --sc-subtle: #97a6c8;
    --sc-accent: #6f8dff; --sc-accent-ink: #070d1c; --sc-badge: #57d2c0;
  }
  body { margin: 0; background: var(--sc-dark); color: var(--sc-text);
         font-family: system-ui, sans-serif; }
  #bar { padding: 10px 16px; display: flex; gap: 8px; align-items: center;
         border-bottom: 1px solid var(--sc-border); }
  #bar button { background: var(--sc-field); color: var(--sc-text);
                border: 1px solid var(--sc-border); border-radius: 8px;
                padding: 6px 12px; font: inherit; cursor: pointer; }
  #bar button[aria-pressed="true"] { background: var(--sc-accent);
                                     color: var(--sc-accent-ink); border-color: transparent; }
  #host { height: 70vh; padding: 16px; }
  #report { padding: 12px 16px; font: 12px/1.6 ui-monospace, monospace;
            white-space: pre-wrap; color: var(--sc-subtle); }
</style>
</head>
<body>
<div id="bar"><strong>data-theme</strong></div>
<div id="host"></div>
<pre id="report">checking…</pre>
<script type="module" src="/theme.tsx"></script>
</body>
</html>
