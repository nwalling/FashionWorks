<!doctype html>
<html lang="en" data-theme="hangarworks">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FashionWorks — try it</title>
<style>
  /* Hangarworks' real palettes, from its own src/lib/themes.ts. The live site
     writes these onto <html> with style.setProperty when the account's theme
     resolves; here they are per-theme rules with the same token names, which
     the component cannot tell apart.

     **Scoped to `html`, and it has to be.** A bare `[data-theme="dolomite"]`
     matches *any* element carrying that attribute, and the theme chips in the
     header carry exactly that -- so each chip inherited the whole palette of
     the theme it names and painted itself in that theme's text colour on the
     current page's background. The three light themes came out at about 1.3:1,
     which reads as a disabled button rather than a bug. The live site never
     hits this, because ThemeProvider writes to document.documentElement and
     nothing else. */
  :root, html[data-theme="hangarworks"] {
    --sc-dark:#0A1219; --sc-card:#16292F; --sc-border:#2C4E5D; --sc-field:#1E3A44;
    --sc-text:#EAF2F6; --sc-subtle:#9FB6C2; --sc-accent:#FF8A34; --sc-badge:#5AD1E6;
    --sc-accent-text:#FF8A34; --sc-accent-ink:#0a1219;
  }
  html[data-theme="dark"] {
    --sc-dark:#0a1c38; --sc-card:#12305a; --sc-border:#23417a;
    --sc-field:rgba(255,255,255,.07); --sc-text:#ffffff;
    --sc-subtle:rgba(255,255,255,.6); --sc-accent:#C8A84B; --sc-badge:#1E90FF;
    --sc-accent-text:#C8A84B; --sc-accent-ink:#0a1219;
  }
  html[data-theme="navy"] {
    --sc-dark:#f6f7fb; --sc-card:#eaeff7; --sc-border:#c3d7ed;
    --sc-field:rgba(0,46,102,.08); --sc-text:#0a1c38; --sc-subtle:#546277;
    --sc-accent:#C8A84B; --sc-accent-text:#72602b; --sc-badge:#1462ad;
    --sc-accent-ink:#0a1219;
  }
  html[data-theme="dolomite"] {
    --sc-dark:#ffffff; --sc-card:#ccd0d9; --sc-border:#b1b8c5;
    --sc-field:rgba(51,51,51,.05); --sc-text:#333333; --sc-subtle:#505153;
    --sc-accent:#e8872b; --sc-accent-text:#764416; --sc-badge:#12589c;
    --sc-accent-ink:#0a1219;
  }
  html[data-theme="nightrunner"] {
    --sc-dark:#0f0e11; --sc-card:#26232c; --sc-border:#3a3641;
    --sc-field:rgba(255,255,255,.06); --sc-text:#ffffff;
    --sc-subtle:rgba(255,255,255,.6); --sc-accent:#ff453a;
    --sc-accent-text:#ff7067; --sc-badge:#5aa9e6; --sc-accent-ink:#0a1219;
  }
  html[data-theme="lovestruck"] {
    --sc-dark:#1a0e16; --sc-card:#2a1422; --sc-border:#43203a;
    --sc-field:rgba(255,255,255,.06); --sc-text:#fdeef5;
    --sc-subtle:rgba(253,238,245,.6); --sc-accent:#ff4d8d;
    --sc-accent-text:#ff4d8d; --sc-badge:#c77dff; --sc-accent-ink:#0a1219;
  }
  html[data-theme="keystone"] {
    --sc-dark:#ffffff; --sc-card:#cdd6e7; --sc-border:#9fb1cb;
    --sc-field:rgba(53,61,93,.08); --sc-text:#353d5d; --sc-subtle:#4c546f;
    --sc-accent:#2e73b8; --sc-accent-text:#22568b; --sc-badge:#4b4f58;
    --sc-accent-ink:#ffffff;
  }
  :root, [data-theme] {
    --sc-surface: color-mix(in srgb, var(--sc-card), var(--sc-text) 7%);
    --sc-surface-2: color-mix(in srgb, var(--sc-card), var(--sc-text) 14%);
    --sc-border-bright: color-mix(in srgb, var(--sc-border), var(--sc-text) 42%);
  }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--sc-dark); color:var(--sc-text);
         font-family: system-ui, -apple-system, sans-serif; height:100vh;
         display:flex; flex-direction:column; overflow:hidden; }
  header { padding:8px 14px; border-bottom:1px solid var(--sc-border);
           display:flex; gap:16px; align-items:center; flex-wrap:wrap; flex:0 0 auto; }
  header strong { font-size:15px; }
  .group { display:flex; gap:5px; align-items:center; }
  .group > span { color:var(--sc-subtle); font-size:12px; margin-right:2px; }
  button { background:var(--sc-field); color:var(--sc-text);
           border:1px solid var(--sc-border); border-radius:8px;
           padding:5px 10px; font:inherit; font-size:13px; cursor:pointer; }
  button:hover:not(:disabled) { border-color:var(--sc-border-bright); }
  button[aria-pressed="true"] { background:var(--sc-accent);
                                color:var(--sc-accent-ink); border-color:transparent; }
  button:disabled { opacity:.5; cursor:default; }
  button:focus-visible { outline:2px solid var(--sc-accent); outline-offset:2px; }
  main { flex:1; display:flex; min-height:0; }
  #panel { width:320px; flex:0 0 320px; border-right:1px solid var(--sc-border);
           display:flex; flex-direction:column; min-height:0; background:var(--sc-card); }
  #slots { display:flex; flex-wrap:wrap; gap:4px; padding:10px; border-bottom:1px solid var(--sc-border); }
  #slots button { font-size:12px; padding:4px 9px; }
  #search { margin:10px 10px 0; padding:7px 10px; border-radius:8px;
            border:1px solid var(--sc-border); background:var(--sc-field);
            color:var(--sc-text); font:inherit; font-size:13px; }
  #items { flex:1; overflow-y:auto; padding:8px 10px 14px; min-height:0; }
  .item { display:block; width:100%; text-align:left; margin:0 0 4px;
          background:transparent; border:1px solid transparent; padding:6px 8px; }
  .item:hover { background:var(--sc-field); }
  .item[aria-pressed="true"] { background:var(--sc-accent); color:var(--sc-accent-ink);
                               border-color:transparent; }
  .item .meta { display:block; font-size:11px; color:var(--sc-subtle); }
  .item[aria-pressed="true"] .meta { color:var(--sc-accent-ink); opacity:.75; }
  #ways { display:flex; flex-wrap:wrap; gap:5px; padding:8px 10px;
          border-top:1px solid var(--sc-border); max-height:130px; overflow-y:auto; }
  .way { width:24px; height:24px; border-radius:6px; padding:0;
         border:1px solid var(--sc-border); }
  .way[aria-pressed="true"] { outline:2px solid var(--sc-accent); outline-offset:1px; }
  #stage { flex:1; position:relative; min-width:0; }
  #view { position:absolute; inset:0; }
  #view canvas { display:block; width:100%; height:100%; position:relative; z-index:1; }
  /* A backdrop is a photograph behind the character, cropped to cover rather
     than stretched. Lighting still comes from the scene: a screenshot is a
     perspective image, not an equirectangular map, so using it to light the
     scene would be wrong. */
  #view.has-backdrop { background-size:cover; background-position:center; }
  #status { position:absolute; left:14px; bottom:12px; font:12px/1.5 ui-monospace,monospace;
            color:var(--sc-subtle); background:color-mix(in srgb, var(--sc-dark), transparent 20%);
            padding:7px 11px; border-radius:8px; pointer-events:none; white-space:pre-wrap;
            max-width:52ch; }
  #hint { position:absolute; right:14px; bottom:12px; font-size:12px; color:var(--sc-subtle);
          pointer-events:none; }
</style>
</head>
<body>
<header>
  <strong>FashionWorks</strong>
  <div class="group" id="themes"><span title="In the product this comes from the signed-in account, not a picker">account theme</span></div>
  <div class="group" id="poses"><span>pose</span></div>
  <div class="group" id="opts"><span>surface</span></div>
  <div class="group" id="acts"></div>
  <div class="group" id="backdrop"><span>backdrop</span></div>
</header>
<main>
  <aside id="panel">
    <div id="slots"></div>
    <input id="search" type="search" placeholder="Search 2,475 pieces…" autocomplete="off">
    <div id="items">reading the catalogue…</div>
    <div id="ways"></div>
  </aside>
  <section id="stage">
    <div id="view"></div>
    <pre id="status">opening your archive…</pre>
    <div id="hint">drag to orbit · wheel to zoom</div>
  </section>
</main>
<script type="module" src="/try.tsx"></script>
</body>
</html>
