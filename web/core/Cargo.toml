# Standalone: not part of StarBreaker's workspace, which lives under
# tools/src/StarBreaker and is a vendored upstream checkout we do not own.
[workspace]

[package]
name = "fashionworks-core"
version = "0.1.0"
edition = "2021"
description = "Reads a Star Citizen Data.p4k from inside a browser, over byte ranges."
license = "MIT"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
starbreaker-p4k = { path = "../../tools/src/StarBreaker/crates/starbreaker-p4k" }
starbreaker-common = { path = "../../tools/src/StarBreaker/crates/starbreaker-common" }
starbreaker-dds = { path = "../../tools/src/StarBreaker/crates/starbreaker-dds" }
starbreaker-chunks = { path = "../../tools/src/StarBreaker/crates/starbreaker-chunks" }
starbreaker-3d = { path = "../../tools/src/StarBreaker/crates/starbreaker-3d", default-features = false }
starbreaker-datacore = { path = "../../tools/src/StarBreaker/crates/starbreaker-datacore" }
zerocopy = { version = "0.8", features = ["derive"] }
wasm-bindgen = "0.2"
js-sys = "0.3"
serde_json = "1"

[profile.release]
# The whole budget for this file is 2 MB brotli (WEB.md), so optimise for size
# and let the linker drop everything the browser build never calls.
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
